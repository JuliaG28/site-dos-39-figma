<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Hero 28 — Arkkhe</title>
<meta name="description" content="Daily Hero 28 · Chrysant / Crystal Lotus — recriação responsiva do design do Figma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="hero" aria-label="Daily Hero 28 — Crystal Lotus">
    <div class="hero__sky" aria-hidden="true"></div>
    <div class="hero__mountains hero__mountains--back" aria-hidden="true"></div>
    <div class="hero__fog" aria-hidden="true"></div>
    <div class="hero__mountains hero__mountains--front" aria-hidden="true"></div>
    <div class="hero__lake" aria-hidden="true"></div>
    <div class="hero__rock" aria-hidden="true"></div>

    <div class="laptop" aria-hidden="true">
      <div class="laptop__screen-wrap">
        <div class="laptop__bezel">
          <div class="laptop__screen">
            <div class="screen__glow"></div>
            <header class="screen__nav">
              <span class="screen__logo">CHRYSANT</span>
              <nav class="screen__links">
                <span>Home</span>
                <span>Collection</span>
                <span>Journal</span>
                <span>Gallery</span>
              </nav>
              <span class="screen__menu">&#9776;</span>
            </header>

            <h3 class="screen__title">Crystal<br>Lotus</h3>

            <div class="screen__item">
              <span class="screen__index">01</span>
              <div>
                <p class="screen__item-title">Frost Dahlia</p>
                <p class="screen__item-copy">A graceful aquatic flower known for its perfect symmetry and calming presence.</p>
                <button class="screen__cta" type="button" tabindex="-1">Know more</button>
              </div>
            </div>

            <span class="screen__index screen__index--muted">02</span>

            <div class="screen__flower" aria-hidden="true"></div>

            <div class="screen__stats">
              <div class="screen__stat">
                <p class="screen__stat-value">164<sup>lx</sup></p>
                <p class="screen__stat-label">Light exposure</p>
              </div>
              <div class="screen__stat">
                <p class="screen__stat-value">84<sup>cm</sup></p>
                <p class="screen__stat-label">Average height</p>
              </div>
            </div>

            <p class="screen__caption">Crafted in<br>crystal</p>
          </div>
        </div>
        <div class="laptop__hinge"></div>
      </div>
      <div class="laptop__base">
        <div class="laptop__trackpad"></div>
      </div>
    </div>

    <div class="hero__content">
      <p class="hero__counter"><span class="hero__counter-num">30</span><span class="hero__counter-total">/30</span></p>
      <h1 class="hero__title">Daily<br>Hero</h1>
    </div>
  </section>
</body>
</html>
